[project]
name = "knowledge-base-rag"
version = "0.1.0"
description = "Multi-source knowledge base RAG platform with incremental sync"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# This historical offline artifact writer contains intentionally long
# generated-report strings; keep the CI gate active for all other files.
"scripts/run_critical_value_validator_forensic_v1.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["app"]

# The initial app/ check found 125 errors in 34 files. Keep the migration
# incremental: strict is enforced for modules that pass it today, while the
# modules below remain explicitly tracked until their existing diagnostics are
# fixed. Do not add inline type: ignore comments as a shortcut.
[[tool.mypy.overrides]]
module = [
    "app.__init__",
    "app.api.__init__",
    "app.connectors.__init__",
    "app.connectors.base",
    "app.evaluation.__init__",
    "app.evaluation.bootstrap",
    "app.evaluation.context_builder",
    "app.evaluation.critical_occurrence_validation",
    "app.evaluation.critical_occurrences",
    "app.evaluation.critical_roles",
    "app.evaluation.critical_validator_architecture_v2",
    "app.evaluation.critical_validator_runtime",
    "app.evaluation.embedding_cache",
    "app.evaluation.fact_evidence",
    "app.evaluation.generation_baseline",
    "app.evaluation.generation_refinement",
    "app.evaluation.index_validation",
    "app.evaluation.rank_metrics",
    "app.evidence.__init__",
    "app.evidence.support_relevance",
    "app.evidence.support_units",
    "app.ingestion.__init__",
    "app.ingestion.chunker",
    "app.ingestion.chunking_config",
    "app.ingestion.fingerprint",
    "app.ingestion.ingest",
    "app.ingestion.markdown_chunker",
    "app.ingestion.models",
    "app.ingestion.web_chunker",
    "app.llm.__init__",
    "app.llm.embedding_models",
    "app.llm.grounding",
    "app.llm.observability",
    "app.llm.ollama_provider",
    "app.migration.__init__",
    "app.migration.aliasing",
    "app.migration.naming",
    "app.migration.startup_guard",
    "app.parsing.__init__",
    "app.parsing.markdown_parser",
    "app.parsing.models",
    "app.parsing.web_parser",
    "app.registry.__init__",
    "app.registry.models",
    "app.reranker.__init__",
    "app.reranker.config",
    "app.retrieval.__init__",
    "app.retrieval.retrieval_observability",
    "app.security.__init__",
    "app.security.audit",
    "app.security.auth",
    "app.security.models",
    "app.server",
    "app.shared.__init__",
    "app.shared.slug",
    "app.shared.tracing",
    "app.sync.__init__",
    "app.sync.manager",
    "app.sync.models",
    "app.ui.__init__",
    "app.ui.citation_formatting",
]
strict = true

