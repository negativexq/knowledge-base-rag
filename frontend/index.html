<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Knowledge Base — Research Workspace</title>
    <script>
      // Apply the saved theme (light by default) before first paint, so a light
      // theme never flashes dark on load. Mirrors src/lib/theme.tsx.
      try {
        var saved = localStorage.getItem("kb-console.theme")
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark" ? saved : "light"
      } catch (e) { document.documentElement.dataset.theme = "light" }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
